name: Refresh public market context
on:
  workflow_dispatch:
  schedule:
    # Beijing 08:15 pre-market and 17:15 after Asian closes.
    - cron: '15 0,9 * * 1-6'
permissions:
  contents: write
concurrency:
  group: public-market-context
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/market-data.test.mjs scripts/duanxianxia.test.mjs
      - run: node scripts/sync-market-context.mjs
      - name: Commit public observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/market-context.json docs/data/market-context.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public market observations'
            git push
          fi
